openapi: 3.1.0
info:
  title: SAOAF Multi-Model Router Mock
  version: 1.0.0
  description: OpenAI-compatible contract mock for an enterprise MMR based on vLLM Semantic Router.
servers:
  - url: http://127.0.0.1:4020
paths:
  /control/v1/profile-snapshots/current:
    get:
      operationId: getCurrentProfileSnapshot
      responses:
        '200':
          description: Current logical profile snapshot
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ProfileSnapshot'}
              example:
                provider_id: multi-model-router
                snapshot_version: mock-1
                contract_version: '2026-09'
                generated_at: '2026-09-22T00:00:00Z'
                valid_until: '2099-01-01T00:00:00Z'
                profiles:
                  - profile_id: reasoning-high-v1
                    capability_keys: [model.reasoning.high]
                    regions: [mock-region-1]
                    data_classification_max: CONFIDENTIAL
                    features: {streaming: false, structured_output: true, tool_calling: false}
                    constraint_schema_version: '1.0'
                    status: AVAILABLE
                digest: 'sha256:mock-profile-snapshot'
                signature: mock-only-not-cryptographic
  /v1/models:
    get:
      operationId: listLogicalProfiles
      responses:
        '200':
          description: Approved logical profiles only
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ModelList'}
              example:
                object: list
                data:
                  - {id: reasoning-high-v1, object: model, created: 1789984800, owned_by: enterprise-mmr}
  /v1/chat/completions:
    post:
      operationId: createChatCompletion
      parameters:
        - {$ref: '#/components/parameters/ResourcePlanId'}
        - {$ref: '#/components/parameters/ResourcePlanItemId'}
        - {$ref: '#/components/parameters/Traceparent'}
        - {$ref: '#/components/parameters/TenantRef'}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ChatRequest'}
            example:
              model: reasoning-high-v1
              messages:
                - {role: user, content: 'mock request'}
              stream: false
      responses:
        '200':
          description: Mock routed completion
          headers:
            X-Model-Route-Decision-ID:
              required: true
              schema: {type: string}
            X-Resource-Plan-ID:
              required: true
              schema: {type: string}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ChatResponse'}
              example:
                id: chatcmpl-mock-001
                object: chat.completion
                created: 1789984800
                model: reasoning-high-v1
                choices:
                  - index: 0
                    message: {role: assistant, content: 'MMR mock response'}
                    finish_reason: stop
                usage: {prompt_tokens: 2, completion_tokens: 3, total_tokens: 5}
                model_route_decision_id: mrd-mock-001
                resource_plan_id: plan-mock-001
                status: SUCCEEDED
                usage_ref: usage-mock-001
        '400': {$ref: '#/components/responses/ProfileNotFound'}
        '429':
          description: Quota exhausted
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorResponse'}
              example: {error: {code: QUOTA_EXCEEDED, message: mock quota exhausted}, model_route_decision_id: mrd-mock-quota, resource_plan_id: plan-mock-001}
        '503':
          description: No eligible backend
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorResponse'}
              example: {error: {code: MODEL_UNAVAILABLE, message: no mock backend available}, model_route_decision_id: mrd-mock-unavailable, resource_plan_id: plan-mock-001}
components:
  parameters:
    ResourcePlanId:
      name: X-Resource-Plan-ID
      in: header
      required: true
      schema: {type: string, minLength: 1}
    ResourcePlanItemId:
      name: X-Resource-Plan-Item-ID
      in: header
      required: true
      schema: {type: string, minLength: 1}
    Traceparent:
      name: traceparent
      in: header
      required: true
      schema: {type: string, pattern: '^00-[0-9a-f]{32}-[0-9a-f]{16}-0[01]$'}
    TenantRef:
      name: X-Tenant-Ref
      in: header
      required: true
      description: Must be injected by a trusted gateway in production.
      schema: {type: string, minLength: 1}
  schemas:
    ChatRequest:
      type: object
      required: [model, messages]
      properties:
        model: {type: string, const: reasoning-high-v1}
        messages:
          type: array
          minItems: 1
          items:
            type: object
            required: [role, content]
            properties:
              role: {type: string, enum: [system, user, assistant, tool]}
              content: {type: string}
            additionalProperties: true
        stream: {type: boolean, default: false}
      additionalProperties: true
    ChatResponse:
      type: object
      required: [id, object, created, model, choices, usage, model_route_decision_id, resource_plan_id, status, usage_ref]
      properties:
        id: {type: string}
        object: {type: string, const: chat.completion}
        created: {type: integer}
        model: {type: string}
        choices: {type: array, items: {type: object, additionalProperties: true}}
        usage: {type: object, additionalProperties: true}
        model_route_decision_id: {type: string}
        resource_plan_id: {type: string}
        status: {type: string, enum: [SUCCEEDED]}
        usage_ref: {type: string}
      additionalProperties: true
    ErrorResponse:
      type: object
      required: [error, model_route_decision_id, resource_plan_id]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code: {type: string}
            message: {type: string}
        model_route_decision_id: {type: string}
        resource_plan_id: {type: string}
    ModelList:
      type: object
      required: [object, data]
      properties:
        object: {type: string, const: list}
        data: {type: array, items: {type: object, additionalProperties: true}}
    ProfileSnapshot:
      type: object
      required: [provider_id, snapshot_version, contract_version, generated_at, valid_until, profiles, digest, signature]
      properties:
        provider_id: {type: string, const: multi-model-router}
        snapshot_version: {type: string}
        contract_version: {type: string}
        generated_at: {type: string, format: date-time}
        valid_until: {type: string, format: date-time}
        profiles: {type: array, items: {type: object, additionalProperties: true}}
        digest: {type: string}
        signature: {type: string}
      additionalProperties: false
  responses:
    ProfileNotFound:
      description: Logical profile is not published
      content:
        application/json:
          schema: {$ref: '#/components/schemas/ErrorResponse'}
          example: {error: {code: PROFILE_NOT_FOUND, message: logical profile not found}, model_route_decision_id: mrd-mock-not-found, resource_plan_id: plan-mock-001}
