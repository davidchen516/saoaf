name: quality

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  GO_VERSION: '1.27.1'

jobs:
  # Blocking priority per I02 acceptance logic (first hit blocks, later
  # gates passing never unblocks): secret leak > high vuln > license > test
  # failure > boundary > lint/format. Job needs below encode review-order,
  # merge requires ALL jobs.
  verify:
    name: build / test / boundary / license
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - name: gofmt
        run: |
          unformatted=$(gofmt -l .)
          [ -z "$unformatted" ] || { echo "gofmt needed: $unformatted"; exit 1; }
      - name: go vet
        run: go vet ./...
      - name: unit tests (race)
        run: go test -race -count=1 ./...
      - name: dependency boundary
        run: go run ./tools/boundarycheck
      - name: license policy
        run: go run ./tools/licensecheck
      - name: build + reproducibility
        run: ./scripts/build.sh

  web:
    name: web build (strict TS)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: npm ci (locked dependencies)
        run: npm ci --no-fund --no-audit
        working-directory: web
      - name: build
        run: npm run build
        working-directory: web

  probes:
    name: startup / liveness probes (real run)
    runs-on: ubuntu-latest
    needs: verify
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - name: build binaries
        run: |
          go build -trimpath -o dist/control-plane-api ./cmd/control-plane-api
          go build -trimpath -o dist/control-plane-worker ./cmd/control-plane-worker
      - name: run API + probe + graceful shutdown
        run: |
          ./dist/control-plane-api -addr 127.0.0.1:18080 & API=$!
          sleep 2
          curl -sf http://127.0.0.1:18080/healthz | grep -q '"status":"alive"'
          curl -sf http://127.0.0.1:18080/readyz  | grep -q '"status":"ready"'
          kill -TERM $API; wait $API
          test $? -eq 0
      - name: run Worker + probe + graceful shutdown
        run: |
          ./dist/control-plane-worker -admin-addr 127.0.0.1:18081 & WK=$!
          sleep 2
          curl -sf http://127.0.0.1:18081/healthz | grep -q '"status":"alive"'
          curl -sf http://127.0.0.1:18081/readyz  | grep -q '"status":"ready"'
          kill -TERM $WK; wait $WK
          test $? -eq 0

  sast:
    name: SAST (gosec)
    runs-on: ubuntu-latest
    needs: verify
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - name: gosec
        run: |
          go install github.com/securego/gosec/v2/cmd/gosec@v2.29.0
          gosec -no-fail -severity high -confidence high -quiet ./...
          gosec -severity high -confidence high -quiet ./...

  sca-secret-sbom:
    name: SCA / secret scan / SBOM
    runs-on: ubuntu-latest
    needs: verify
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: govulncheck (high-severity gate)
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@v1.1.4
          govulncheck ./...
      - name: secret scan (gitleaks, full history)
        uses: gitleaks/gitleaks-action@ff98106e4c144b3433531b4f393f336d4d0af3b5
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: SBOM (syft, digest-tied)
        uses: anchore/sbom-action@f8b1f0ad7ded37eb98e7c21dc1d1c9218d1dd4ee
        with:
          format: cyclonedx-json
          artifact-type: directory
          output-file: sbom.cdx.json
      - name: upload SBOM artifact
        uses: actions/upload-artifact@v4
        with:
          name: sbom-cyclonedx
          path: sbom.cdx.json
