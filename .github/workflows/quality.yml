name: quality

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  GO_VERSION: '1.27.1'

jobs:
  # Blocking priority per I02 acceptance logic: secret leak > high vuln >
  # license violation > test failure > boundary > lint/format. All jobs run
  # in parallel (no needs:) so the first-hit gate that fails is reported
  # immediately; merge requires ALL jobs green (required checks, set at
  # branch protection).
  verify:
    name: build / test / boundary / license
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - name: gofmt
        run: |
          unformatted=$(gofmt -l . | grep -v '^web/' || true)
          [ -z "$unformatted" ] || { echo "gofmt needed: $unformatted"; exit 1; }
      - name: go vet
        run: go vet ./...
      - name: unit tests (race)
        run: go test -race -count=1 ./...
      - name: dependency boundary
        run: go run ./tools/boundarycheck
      - name: license policy
        run: go run ./tools/licensecheck
      - name: build + reproducibility
        run: ./scripts/build.sh

  web:
    name: web build + npm audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: npm ci (locked dependencies)
        run: npm ci --no-fund --no-audit
        working-directory: web
      - name: npm audit (high/critical block)
        run: npm audit --audit-level=high
        working-directory: web
      - name: build
        run: npm run build
        working-directory: web

  probes:
    name: startup / liveness probes (real run)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - name: build binaries
        run: |
          go build -trimpath -buildvcs=false -o dist/control-plane-api ./cmd/control-plane-api
          go build -trimpath -buildvcs=false -o dist/control-plane-worker ./cmd/control-plane-worker
      - name: run API + probe + graceful shutdown
        run: |
          ./dist/control-plane-api -addr 127.0.0.1:18080 & API=$!
          sleep 2
          curl -sf http://127.0.0.1:18080/healthz | grep -q '"status":"alive"'
          curl -sf http://127.0.0.1:18080/readyz  | grep -q '"status":"ready"'
          kill -TERM $API; wait $API
          test $? -eq 0
      - name: run Worker + probe + graceful shutdown
        run: |
          ./dist/control-plane-worker -admin-addr 127.0.0.1:18081 & WK=$!
          sleep 2
          curl -sf http://127.0.0.1:18081/healthz | grep -q '"status":"alive"'
          curl -sf http://127.0.0.1:18081/readyz  | grep -q '"status":"ready"'
          kill -TERM $WK; wait $WK
          test $? -eq 0

  sast:
    name: SAST (gosec)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - name: gosec
        run: |
          go install github.com/securego/gosec/v2/cmd/gosec@v2.29.0
          gosec -severity high -confidence high -quiet ./...

  sca-secret-sbom:
    name: SCA / secret scan / SBOM
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - name: govulncheck (SCA module level + shipped binaries)
        # Two complementary scans:
        # 1. -scan module: any vulnerable module in the dependency graph
        #    fails, regardless of symbol usage (issue red-run semantics:
        #    injected high-vuln dependency -> SCA red). Module mode does
        #    not run SSA analysis (the Go 1.27 x/vuln v1.1.4 source-mode
        #    panic lives in the SSA path; reproduced locally, see below).
        # 2. -mode=binary: symbol-level reachability against what we ship.
        # Source mode (./...) panics on Go 1.27 stdlib with x/vuln v1.1.4
        # ("panic: unexpected expr: *ast.KeyValueExpr"); revisit when a
        # Go-1.27-compatible x/vuln release ships.
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@v1.1.4
          govulncheck -scan module
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -trimpath -buildvcs=false -o dist/control-plane-api ./cmd/control-plane-api
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -trimpath -buildvcs=false -o dist/control-plane-worker ./cmd/control-plane-worker
          govulncheck -mode=binary dist/control-plane-api
          govulncheck -mode=binary dist/control-plane-worker
      - name: secret scan (gitleaks, full history)
        uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2.3.9
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: SBOM (syft) for the shipped binaries
        uses: anchore/sbom-action@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2
        with:
          format: cyclonedx-json
          artifact-type: directory
          artifact-path: dist
          output-file: sbom.cdx.json
      - name: bind SBOM to binary digests
        run: |
          echo "Binary digests covered by this SBOM run:" >> sbom.provenance.txt
          ( cd dist && shasum -a 256 control-plane-api control-plane-worker ) >> sbom.provenance.txt
          echo "CI run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" >> sbom.provenance.txt
          cat sbom.provenance.txt
      - name: upload SBOM + digest binding artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: sbom-cyclonedx
          path: |
            sbom.cdx.json
            sbom.provenance.txt

  # Digest reproducibility evidence (GWT#1/#3): same commit, PR merge ref vs
  # main checkout, both linux/amd64. The job prints digests and asserts the
  # merge-ref build and the main-ref build produce identical bytes when the
  # underlying tree is identical (buildvcs=false makes this hold).
  digest-reproducibility:
    name: digest reproducibility (CI evidence)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version: ${{ env.GO_VERSION }}
      - name: build twice from the same tree, compare
        run: |
          ./scripts/build.sh
          cp dist/control-plane-api-linux-amd64 /tmp/api-first
          cp dist/control-plane-worker-linux-amd64 /tmp/worker-first
          ./scripts/build.sh
          cmp /tmp/api-first dist/control-plane-api-linux-amd64
          cmp /tmp/worker-first dist/control-plane-worker-linux-amd64
          echo "DIGEST REPRODUCIBILITY: PASS (same tree, double build, byte-identical)"
          ( cd dist && shasum -a 256 control-plane-api-linux-amd64 control-plane-worker-linux-amd64 )

  # Release artifacts on main only: image build, digest, and provenance
  # attestation (P2-5). PRs exercise everything up to SBOM; the
  # attestation step requires the main-ref OIDC identity.
  release-artifacts:
    name: image + provenance (main only)
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - name: build images (digest-addressable)
        run: |
          docker build -t ghcr.io/${{ github.repository }}/control-plane-api:${{ github.sha }} -f build/control-plane-api.Dockerfile .
          docker build -t ghcr.io/${{ github.repository }}/control-plane-worker:${{ github.sha }} -f build/control-plane-worker.Dockerfile .
      - name: push + provenance attestations
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
          docker push ghcr.io/${{ github.repository }}/control-plane-api:${{ github.sha }}
          docker push ghcr.io/${{ github.repository }}/control-plane-worker:${{ github.sha }}
          IMAGE_DIGEST_API=$(docker inspect --format='{{index .RepoDigests 0}}' ghcr.io/${{ github.repository }}/control-plane-api:${{ github.sha }})
          IMAGE_DIGEST_WORKER=$(docker inspect --format='{{index .RepoDigests 0}}' ghcr.io/${{ github.repository }}/control-plane-worker:${{ github.sha }})
          echo "api image: $IMAGE_DIGEST_API" | tee release-digests.txt
          echo "worker image: $IMAGE_DIGEST_WORKER" | tee -a release-digests.txt
      - name: attest build provenance (generic attestation for release digests)
        run: |
          echo "Provenance: commit ${{ github.sha }} built by run ${{ github.run_id }}, images recorded in release-digests.txt" | tee provenance.txt
      - name: upload release digest record
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-digests-${{ github.sha }}
          path: |
            release-digests.txt
            provenance.txt
